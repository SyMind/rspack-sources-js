# Copied from web-infra-dev/rspack at d0b2a44659d11fe3076261688ebad0f8a2cd476a.
[package]
authors = ["Rspack Teams"]
categories = ["development-tools", "web-programming"]
description = "Rusty webpack-sources port."
documentation = "https://rspack.rs/"
edition = "2024"
homepage = "https://rspack.rs/"
keywords = ["sources", "sourcemap"]
license = "MIT"
name = "rspack_sources"
readme = "README.md"
repository = "https://github.com/web-infra-dev/rspack"
version = "0.103.1"

[features]
allocative = ["dep:rspack-allocative"]
binding = ["dep:napi"]
codspeed = []
rspack_cacheable = ["dep:rkyv"]

[dependencies]
bytes = { version = "1.12.1", default-features = false }
bytes-str = { version = "0.2.7", default-features = false, features = ["serde"] }
memchr = { version = "2.8.3", default-features = false, features = ["std"] }
napi = { version = "=3.16.0", optional = true, default-features = false, features = ["napi8"] }
rkyv = { version = "=0.8.18", default-features = false, features = ["std", "bytecheck", "smallvec-1"], optional = true }
rspack-allocative = { version = "=0.103.0", default-features = false, features = ["camino", "dashmap", "indexmap", "tokio", "once_cell", "ustr", "atomic_refcell"], optional = true }
rustc-hash = { version = "2.1.3", default-features = false, features = ["std"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "rc", "std"] }
simd-json = { version = "0.17.3", default-features = false, features = ["runtime-detection", "serde_impl", "swar-number-parsing"] }
simd-utf16-len = { version = "0.3.1", default-features = false }
static_assertions = { version = "1.1.0", default-features = false }
triomphe = { version = "0.1.17", default-features = false, features = ["std"] }

[dev-dependencies]
regex = { version = "1.13.1", default-features = false, features = ["perf"] }
twox-hash = { version = "2.1.5", default-features = false, features = ["xxhash64"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(allocative)"] }
